<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KJNOX - Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand marca" href="index.html">KJNOX</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container seccion">
        <h1>Contacto</h1>
        <p>Escribe tus dudas o comentarios.</p>

        <div class="formulario mx-auto">
            <form id="formularioContacto">
                <label for="nombreContacto">Nombre</label>
                <input type="text" id="nombreContacto" required>

                <label for="correoContacto">Correo electrónico</label>
                <input type="email" id="correoContacto" required>

                <label for="asuntoContacto">Asunto</label>
                <input type="text" id="asuntoContacto" required>

                <label for="mensajeContacto">Mensaje</label>
                <textarea id="mensajeContacto" rows="5" required></textarea>

                <button type="submit" class="boton">Enviar mensaje</button>
            </form>

            <p id="respuestaContacto" class="mensaje"></p>
        </div>

        <div class="tarjeta mt-4">
            <h3>Información</h3>
            <p>Nombre de la tienda: KJNOX</p>
            <p>Productos: Fragancias Armaf Odyssey</p>
        </div>
    </div>

    <footer>
        <p>© 2026 KJNOX - Contacto</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
