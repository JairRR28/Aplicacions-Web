<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KJNOX - Ventas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand marca" href="index.html">KJNOX</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container seccion">
        <h1>Registro de ventas</h1>
        <p>Llena los datos para guardar una venta.</p>

        <div class="formulario mx-auto">
            <form id="formularioVenta">
                <label for="cliente">Nombre del cliente</label>
                <input type="text" id="cliente" required>

                <label for="productoVenta">Producto</label>
                <select id="productoVenta" required>
                    <option value="">Selecciona un producto</option>
                </select>

                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" min="1" value="1" required>

                <label for="precio">Precio por unidad (MXN)</label>
                <input type="number" id="precio" min="0.01" step="0.01" required>

                <button type="submit" class="boton">Guardar venta</button>
            </form>

            <p id="mensajeVenta" class="mensaje"></p>
        </div>

        <h2 class="mt-5">Ventas registradas</h2>

        <div class="table-responsive">
            <table class="table tabla-oscura">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="tablaVentas"></tbody>
            </table>
        </div>

        <p id="totalVentas"></p>

        <button type="button" class="boton" id="borrarVentas">
            Borrar registros
        </button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JavaScript/funtion.js"></script>
</body>
</html>
